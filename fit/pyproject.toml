[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aifit"
version = "0.3.0"
description = "Fit: everyday AI style quiz and installable setup"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.115",
  "uvicorn>=0.30"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
aifit = "aifit.cli:app"

[tool.hatch.build.targets.wheel.force-include]
"packages/core/src/aifit" = "aifit"

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["packages/core/src"]

[tool.vercel]
entrypoint = "services.api.main:app"

[tool.pytest.ini_options]
pythonpath = ["packages/core/src", "."]
testpaths = ["tests"]
