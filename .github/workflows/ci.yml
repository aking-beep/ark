name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  my-ai-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e 'my-ai/[dev]'
      - run: npm run test:my-ai
      - run: PYTHONPATH=packages/core/src python -m evals.harness validate-seed
        working-directory: my-ai
        env:
          MYAI_ROOT: ${{ github.workspace }}/my-ai
      - run: PYTHONPATH=packages/core/src python -m evals.harness run-cases
        working-directory: my-ai
        env:
          MYAI_ROOT: ${{ github.workspace }}/my-ai

  consumer-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @ark/consumer
        env:
          API_ORIGIN: http://127.0.0.1:8472
