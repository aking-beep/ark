<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif">
  <rect width="1120" height="760" rx="14" fill="#08090c"/>

  <text x="36" y="46" fill="#e6eaf0" font-size="21" font-weight="600">How a guess becomes a measurement</text>
  <text x="36" y="70" fill="#6b7689" font-size="13">Riverbend Supply, support triage. Every number below is from the seeded demo telemetry in this repo &#8212; <tspan font-family="ui-monospace, Menlo, monospace" fill="#96a0b2">npm run db:seed</tspan>.</text>

  <!-- ring -->
  <ellipse cx="560" cy="418" rx="390" ry="212" fill="none" stroke="#222836" stroke-width="1.5" stroke-dasharray="5 7"/>

  <!-- arrowheads along the ring, clockwise -->
  <g fill="#333b4d">
    <path d="M -9,-6 L 9,0 L -9,6 Z" transform="translate(755,234) rotate(18.2)"/>
    <path d="M -9,-6 L 9,0 L -9,6 Z" transform="translate(950,418) rotate(90)"/>
    <path d="M -9,-6 L 9,0 L -9,6 Z" transform="translate(755,602) rotate(161.8)"/>
    <path d="M -9,-6 L 9,0 L -9,6 Z" transform="translate(365,602) rotate(198.2)"/>
    <path d="M -9,-6 L 9,0 L -9,6 Z" transform="translate(170,418) rotate(270)"/>
    <path d="M -9,-6 L 9,0 L -9,6 Z" transform="translate(365,234) rotate(341.8)"/>
  </g>

  <!-- centre -->
  <text x="560" y="400" text-anchor="middle" fill="#6b7689" font-size="12" letter-spacing="1.6">THE LADDER THIS TURNS</text>
  <text x="528" y="436" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="19" font-weight="600" fill="#fbbf24">heuristic</text>
  <path d="M 538 430 L 578 430" stroke="#6b7689" stroke-width="2"/>
  <path d="M -7,-5 L 6,0 L -7,5 Z" transform="translate(584,430)" fill="#6b7689"/>
  <text x="592" y="436" text-anchor="start" font-family="ui-monospace, Menlo, monospace" font-size="19" font-weight="600" fill="#5eead4">measured</text>
  <text x="560" y="462" text-anchor="middle" fill="#4a5468" font-size="11.5">and, when step 4 fails, quietly back again</text>

  <!-- N1 top -->
  <g>
    <rect x="410" y="92" width="300" height="104" rx="10" fill="#12151c" stroke="#333b4d"/>
    <text x="428" y="118" fill="#5eead4" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, monospace">01</text>
    <text x="456" y="118" fill="#e6eaf0" font-size="13" font-weight="600">The runtime emits</text>
    <text x="428" y="141" fill="#96a0b2" font-size="11.5">Every model call POSTs with a trace id and a</text>
    <text x="428" y="158" fill="#96a0b2" font-size="11.5">turn index. Nothing else is required of the</text>
    <text x="428" y="175" fill="#96a0b2" font-size="11.5">caller. Seed: 11,800 events, 2,064 traces.</text>
  </g>

  <!-- N2 right-top -->
  <g>
    <rect x="748" y="207" width="300" height="104" rx="10" fill="#12151c" stroke="#333b4d"/>
    <text x="766" y="233" fill="#5eead4" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, monospace">02</text>
    <text x="794" y="233" fill="#e6eaf0" font-size="13" font-weight="600">Control prices and flags</text>
    <text x="766" y="256" fill="#96a0b2" font-size="11.5">Priced from the catalog. An unknown model is</text>
    <text x="766" y="273" fill="#96a0b2" font-size="11.5">accepted, flagged, counted &#8212; never dropped.</text>
    <text x="766" y="290" fill="#96a0b2" font-size="11.5">The prompt sample is scanned, then discarded.</text>
  </g>

  <!-- N3 right-bottom -->
  <g>
    <rect x="748" y="429" width="300" height="104" rx="10" fill="#12151c" stroke="#0f766e"/>
    <text x="766" y="455" fill="#5eead4" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, monospace">03</text>
    <text x="794" y="455" fill="#e6eaf0" font-size="13" font-weight="600">Priors, per pattern, 30 days</text>
    <text x="766" y="478" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#c3cad6">bounded-agent  n=881</text>
    <text x="766" y="495" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#96a0b2">8.25 turns/outcome &#183; 894 ctx growth</text>
    <text x="766" y="512" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#96a0b2">16.1% fail &#183; 2.0 retries/fail &#183; 45.1% cache</text>
  </g>

  <!-- N4 bottom -->
  <g>
    <rect x="410" y="640" width="300" height="104" rx="10" fill="#12151c" stroke="#333b4d"/>
    <text x="428" y="666" fill="#5eead4" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, monospace">04</text>
    <text x="456" y="666" fill="#e6eaf0" font-size="13" font-weight="600">AIFit asks, once, over HTTP</text>
    <text x="428" y="689" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#c3cad6">GET /api/v1/calibration?days=30</text>
    <text x="428" y="707" fill="#96a0b2" font-size="11.5">2.5s timeout, strict schema, <tspan font-family="ui-monospace, Menlo, monospace" fill="#fbbf24">null</tspan> on anything</text>
    <text x="428" y="724" fill="#96a0b2" font-size="11.5">else. It never throws and never half-applies.</text>
  </g>

  <!-- N5 left-bottom -->
  <g>
    <rect x="72" y="429" width="300" height="104" rx="10" fill="#12151c" stroke="#0f766e"/>
    <text x="90" y="455" fill="#5eead4" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, monospace">05</text>
    <text x="118" y="455" fill="#e6eaf0" font-size="13" font-weight="600">The basis flips on the report</text>
    <text x="90" y="478" fill="#96a0b2" font-size="11.5">$0.137 per outcome stops being a rule of</text>
    <text x="90" y="495" fill="#96a0b2" font-size="11.5">thumb and becomes Riverbend's own traffic.</text>
    <text x="90" y="512" fill="#96a0b2" font-size="11.5">The tag beside it changes, in public.</text>
  </g>

  <!-- N6 left-top -->
  <g>
    <rect x="72" y="207" width="300" height="104" rx="10" fill="#12151c" stroke="#78350f"/>
    <text x="90" y="233" fill="#fbbf24" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, monospace">06</text>
    <text x="118" y="233" fill="#e6eaf0" font-size="13" font-weight="600">The drift page marks the rubric</text>
    <text x="90" y="256" fill="#96a0b2" font-size="11.5">Rubric said 7 turns. Reality is 8.25 &#8212; an 18%</text>
    <text x="90" y="273" fill="#96a0b2" font-size="11.5">cost error, on synthetic data built to behave.</text>
    <text x="90" y="290" fill="#96a0b2" font-size="11.5">Someone then edits <tspan font-family="ui-monospace, Menlo, monospace" fill="#c3cad6">priors.ts</tspan>. That is the loop.</text>
  </g>
</svg>
