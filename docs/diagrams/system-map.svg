<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" width="1080" height="700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif">
  <rect width="1080" height="700" rx="14" fill="#08090c"/>

  <text x="34" y="44" fill="#e6eaf0" font-size="21" font-weight="600">Three surfaces, one engine, one wire between them</text>
  <text x="34" y="68" fill="#6b7689" font-size="13">The interesting part of this picture is the line that is <tspan fill="#f87171">missing</tspan>, not the ones that are drawn.</text>

  <!-- ===== packages/core ===== -->
  <rect x="270" y="96" width="540" height="98" rx="12" fill="#12151c" stroke="#0f766e" stroke-width="1.5"/>
  <text x="290" y="124" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#5eead4">packages/core</text>
  <text x="418" y="124" fill="#6b7689" font-size="11.5">&#8212; no React, no database, no network. 36 tests.</text>
  <text x="290" y="148" fill="#c3cad6" font-size="12">Workload schema &#183; suitability &#183; architecture &#183; security &#183; evaluation &#183; roadmap</text>
  <text x="290" y="168" fill="#c3cad6" font-size="12">model catalog &#183; token economics &#183; value model &#183; the provenance ladder</text>
  <text x="290" y="186" fill="#96a0b2" font-size="11.5" font-style="italic">One <tspan font-family="ui-monospace, Menlo, monospace" font-style="normal" fill="#5eead4">assess()</tspan>. Depth changes what is asked and shown, never how it reasons.</text>

  <!-- fan-out lines -->
  <path d="M 540 194 L 540 214" stroke="#0f766e" stroke-width="1.5"/>
  <path d="M 150 214 L 930 214" stroke="#0f766e" stroke-width="1.5"/>
  <path d="M 150 214 L 150 250" stroke="#0f766e" stroke-width="1.5"/>
  <path d="M 540 214 L 540 250" stroke="#0f766e" stroke-width="1.5"/>
  <path d="M 930 214 L 930 250" stroke="#0f766e" stroke-width="1.5"/>
  <text x="556" y="209" fill="#0f766e" font-size="10.5" font-family="ui-monospace, Menlo, monospace">imported by all three</text>

  <!-- ===== consumer ===== -->
  <rect x="34" y="254" width="232" height="150" rx="12" fill="#12151c" stroke="#333b4d"/>
  <text x="54" y="282" fill="#e6eaf0" font-size="13.5" font-weight="600">AIFit</text>
  <text x="54" y="302" fill="#6b7689" font-size="11" font-family="ui-monospace, Menlo, monospace">apps/consumer &#183; :3000</text>
  <line x1="54" y1="314" x2="246" y2="314" stroke="#222836"/>
  <text x="54" y="334" fill="#c3cad6" font-size="11.5">Six questions about one task.</text>
  <text x="54" y="352" fill="#c3cad6" font-size="11.5">A straight answer, including</text>
  <text x="54" y="370" fill="#c3cad6" font-size="11.5">"don't use AI for this".</text>
  <rect x="54" y="380" width="128" height="20" rx="10" fill="#0d0f14" stroke="#333b4d"/>
  <text x="118" y="394" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#6b7689">stores nothing</text>

  <!-- ===== business ===== -->
  <rect x="424" y="254" width="232" height="150" rx="12" fill="#12151c" stroke="#333b4d"/>
  <text x="444" y="282" fill="#e6eaf0" font-size="13.5" font-weight="600">AIFit for teams</text>
  <text x="444" y="302" fill="#6b7689" font-size="11" font-family="ui-monospace, Menlo, monospace">apps/business &#183; :3001</text>
  <line x1="444" y1="314" x2="636" y2="314" stroke="#222836"/>
  <text x="444" y="334" fill="#c3cad6" font-size="11.5">Eight sections about one</text>
  <text x="444" y="352" fill="#c3cad6" font-size="11.5">workload. Verdict, model,</text>
  <text x="444" y="370" fill="#c3cad6" font-size="11.5">controls, eval plan, cost.</text>
  <rect x="444" y="380" width="128" height="20" rx="10" fill="#0d0f14" stroke="#333b4d"/>
  <text x="508" y="394" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#6b7689">stores nothing</text>

  <!-- ===== control ===== -->
  <rect x="814" y="254" width="232" height="240" rx="12" fill="#12151c" stroke="#0f766e"/>
  <text x="834" y="282" fill="#e6eaf0" font-size="13.5" font-weight="600">ARK Control</text>
  <text x="834" y="302" fill="#6b7689" font-size="11" font-family="ui-monospace, Menlo, monospace">apps/control &#183; :3002</text>
  <line x1="834" y1="314" x2="1026" y2="314" stroke="#222836"/>
  <text x="834" y="334" fill="#c3cad6" font-size="11.5">Spend, loops, budgets, PII,</text>
  <text x="834" y="352" fill="#c3cad6" font-size="11.5">unapproved actions &#8212; and the</text>
  <text x="834" y="370" fill="#c3cad6" font-size="11.5">drift page that grades AIFit.</text>
  <rect x="834" y="382" width="192" height="84" rx="8" fill="#0d1715" stroke="#0f766e" stroke-dasharray="4 4"/>
  <text x="850" y="404" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700" fill="#5eead4">packages/db</text>
  <text x="850" y="422" fill="#96a0b2" font-size="11">Drizzle over libSQL</text>
  <text x="850" y="439" fill="#96a0b2" font-size="11">9 tables &#183; one local file</text>
  <text x="850" y="456" fill="#6b7689" font-size="10.5">Control is its only reader.</text>

  <!-- ===== the one wire ===== -->
  <path d="M 150 404 L 150 482 L 300 482" stroke="#0f766e" stroke-width="1.5" fill="none" stroke-dasharray="6 5"/>
  <path d="M 540 404 L 540 458" stroke="#0f766e" stroke-width="1.5" fill="none" stroke-dasharray="6 5"/>
  <path d="M 600 482 L 824 482 L 824 496" stroke="#0f766e" stroke-width="1.5" fill="none" stroke-dasharray="6 5"/>
  <path d="M -7,-5 L 7,0 L -7,5 Z" transform="translate(824,501) rotate(-90)" fill="#0f766e"/>
  <rect x="300" y="458" width="300" height="40" rx="8" fill="#08090c" stroke="#0f766e"/>
  <text x="314" y="475" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5eead4">GET /api/v1/calibration?days=30</text>
  <text x="314" y="491" fill="#6b7689" font-size="10.5">2.5s timeout &#183; strict schema &#183; null on failure</text>

  <!-- ===== the missing line ===== -->
  <rect x="34" y="522" width="740" height="144" rx="12" fill="#12151c" stroke="#7f1d1d"/>
  <text x="56" y="550" fill="#f87171" font-size="13" font-weight="600">The boundary that is load-bearing</text>
  <text x="56" y="574" fill="#c3cad6" font-size="12"><tspan font-family="ui-monospace, Menlo, monospace">apps/consumer</tspan> and <tspan font-family="ui-monospace, Menlo, monospace">apps/business</tspan> do not list <tspan font-family="ui-monospace, Menlo, monospace" fill="#f87171">@ark/db</tspan> as a dependency.</text>
  <text x="56" y="594" fill="#96a0b2" font-size="11.5">The package manager enforces that, which makes it the cheapest possible check on the most</text>
  <text x="56" y="612" fill="#96a0b2" font-size="11.5">important constraint in the repo.</text>
  <text x="56" y="636" fill="#96a0b2" font-size="11.5">With a direct database read, a stale connection or a partial query would produce numbers that</text>
  <text x="56" y="654" fill="#96a0b2" font-size="11.5"><tspan font-style="italic" fill="#c3cad6">look</tspan> measured. Across this wire there are two states: <tspan fill="#5eead4">measured, with a sample size</tspan> &#8212; or <tspan fill="#fbbf24">heuristic, and the page says so</tspan>.</text>

  <!-- ===== ingest ===== -->
  <rect x="794" y="522" width="252" height="144" rx="12" fill="#12151c" stroke="#333b4d"/>
  <text x="814" y="550" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700" fill="#c3cad6">POST /api/v1/events</text>
  <text x="814" y="574" fill="#96a0b2" font-size="11.5">Your runtime, batched.</text>
  <text x="814" y="592" fill="#96a0b2" font-size="11.5">Idempotent by event id.</text>
  <text x="814" y="610" fill="#96a0b2" font-size="11.5">Strict about shape,</text>
  <text x="814" y="628" fill="#96a0b2" font-size="11.5">permissive about content.</text>
  <text x="814" y="650" fill="#6b7689" font-size="10.5">Returns the circuit breaks to act on.</text>
  <path d="M 920 522 L 920 494" stroke="#333b4d" stroke-width="1.5"/>
</svg>
