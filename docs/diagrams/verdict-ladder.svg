<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 880" width="1080" height="880" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif">
  <rect width="1080" height="880" rx="14" fill="#08090c"/>

  <text x="34" y="44" fill="#e6eaf0" font-size="21" font-weight="600">How the engine decides &#8212; and how it says no</text>
  <text x="34" y="68" fill="#6b7689" font-size="13">This is <tspan font-family="ui-monospace, Menlo, monospace" fill="#96a0b2">decideVerdict()</tspan> in <tspan font-family="ui-monospace, Menlo, monospace" fill="#96a0b2">packages/core/src/assess/suitability.ts</tspan>, drawn line for line. Both surfaces run this. Neither can soften it.</text>

  <!-- ===== dimension weights strip ===== -->
  <text x="34" y="104" fill="#4a5468" font-size="11" letter-spacing="1.6">STEP 1 &#8212; SEVEN DIMENSIONS, WEIGHTED, 0&#8211;100 EACH</text>

  <g>
    <rect x="34" y="116" width="222" height="34" rx="6" fill="#0f766e" opacity="0.55"/>
    <rect x="260" y="116" width="162" height="34" rx="6" fill="#0f766e" opacity="0.46"/>
    <rect x="426" y="116" width="162" height="34" rx="6" fill="#0f766e" opacity="0.40"/>
    <rect x="592" y="116" width="140" height="34" rx="6" fill="#0f766e" opacity="0.34"/>
    <rect x="736" y="116" width="140" height="34" rx="6" fill="#0f766e" opacity="0.28"/>
    <rect x="880" y="116" width="100" height="34" rx="6" fill="#0f766e" opacity="0.22"/>
    <rect x="984" y="116" width="62" height="34" rx="6" fill="#0f766e" opacity="0.18"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#c3cad6" text-anchor="middle">
      <text x="145" y="138">0.22</text><text x="341" y="138">0.16</text><text x="507" y="138">0.16</text>
      <text x="662" y="138">0.14</text><text x="806" y="138">0.14</text><text x="930" y="138">0.10</text><text x="1015" y="138">0.08</text>
    </g>
    <g font-size="10.5" fill="#6b7689" text-anchor="middle">
      <text x="145" y="166">Task fit</text>
      <text x="341" y="166">Tolerance for variation</text>
      <text x="507" y="166">Cost of being wrong</text>
      <text x="662" y="166">Data readiness</text>
      <text x="806" y="166">Volume economics</text>
      <text x="930" y="166">Value / unit</text>
      <text x="1015" y="166">Risk load</text>
    </g>
  </g>

  <text x="34" y="196" fill="#4a5468" font-size="11" letter-spacing="1.6">STEP 2 &#8212; EIGHT GATES, IN THIS ORDER. THE FIRST MATCH WINS AND NOTHING BELOW IT RUNS.</text>

  <!-- ===== gate rows ===== -->
  <!-- 1 -->
  <rect x="34" y="210" width="1012" height="54" rx="9" fill="#12151c" stroke="#222836"/>
  <text x="54" y="234" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#4a5468">01</text>
  <text x="86" y="234" fill="#e6eaf0" font-size="12.5">Every task shape is <tspan font-family="ui-monospace, Menlo, monospace" fill="#96a0b2">calculate</tspan> or <tspan font-family="ui-monospace, Menlo, monospace" fill="#96a0b2">lookup</tspan></text>
  <text x="86" y="252" fill="#6b7689" font-size="11">"Reconcile the Stripe payout against the ledger" never reaches the scorer. A query and a cron job are the correct answer.</text>
  <rect x="824" y="222" width="200" height="30" rx="8" fill="#1a0f12" stroke="#7f1d1d"/>
  <text x="924" y="242" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#f87171">not-ai</text>

  <!-- 2 -->
  <rect x="34" y="270" width="1012" height="98" rx="9" fill="#12151c" stroke="#78350f"/>
  <text x="54" y="294" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#4a5468">02</text>
  <text x="86" y="294" fill="#e6eaf0" font-size="12.5">Any of four hard blockers is present &#8212; these cap the verdict regardless of score</text>
  <text x="86" y="312" fill="#96a0b2" font-size="11">&#183; Zero error tolerance with autonomy past <tspan font-family="ui-monospace, Menlo, monospace">approve</tspan>. Accept a defect rate, or keep a human in the path. Not neither.</text>
  <text x="86" y="328" fill="#96a0b2" font-size="11">&#183; Under 50 units a month, done on someone else's behalf. That is a buy-or-do-manually decision, not a build.</text>
  <text x="86" y="344" fill="#96a0b2" font-size="11">&#183; An irreversible action under <tspan font-family="ui-monospace, Menlo, monospace">bounded</tspan> or <tspan font-family="ui-monospace, Menlo, monospace">full</tspan> autonomy. The offending actions are named. Put a human gate on them first.</text>
  <text x="86" y="360" fill="#96a0b2" font-size="11">&#183; <tspan font-family="ui-monospace, Menlo, monospace">credentials</tspan> in the data flow. Redact or vault them before a prompt is ever constructed.</text>
  <rect x="824" y="286" width="200" height="30" rx="8" fill="#161006" stroke="#78350f"/>
  <text x="924" y="306" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#fbbf24">not-yet</text>

  <!-- 3 -->
  <rect x="34" y="374" width="1012" height="46" rx="9" fill="#12151c" stroke="#222836"/>
  <text x="54" y="402" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#4a5468">03</text>
  <text x="86" y="402" fill="#e6eaf0" font-size="12.5">Weighted score <tspan font-family="ui-monospace, Menlo, monospace" fill="#f87171">&lt; 40</tspan> &#8212; the shape is wrong, not the timing</text>
  <rect x="824" y="382" width="200" height="30" rx="8" fill="#1a0f12" stroke="#7f1d1d"/>
  <text x="924" y="402" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#f87171">not-ai</text>

  <!-- 4 -->
  <rect x="34" y="426" width="1012" height="46" rx="9" fill="#12151c" stroke="#222836"/>
  <text x="54" y="454" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#4a5468">04</text>
  <text x="86" y="454" fill="#e6eaf0" font-size="12.5">Weighted score <tspan font-family="ui-monospace, Menlo, monospace" fill="#fbbf24">&lt; 58</tspan> &#8212; plausible, but something has to change first</text>
  <rect x="824" y="434" width="200" height="30" rx="8" fill="#161006" stroke="#78350f"/>
  <text x="924" y="454" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#fbbf24">not-yet</text>

  <!-- 5 -->
  <rect x="34" y="478" width="1012" height="54" rx="9" fill="#12151c" stroke="#222836"/>
  <text x="54" y="502" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#4a5468">05</text>
  <text x="86" y="502" fill="#e6eaf0" font-size="12.5">Score <tspan font-family="ui-monospace, Menlo, monospace" fill="#818cf8">&lt; 72</tspan>, <tspan font-style="italic">or</tspan> <tspan font-family="ui-monospace, Menlo, monospace" fill="#818cf8">errorTolerance === 'none'</tspan></text>
  <text x="86" y="520" fill="#6b7689" font-size="11">A perfect score cannot buy its way past zero tolerance for error. A person reviews every output.</text>
  <rect x="824" y="490" width="200" height="30" rx="8" fill="#0e1018" stroke="#312e81"/>
  <text x="924" y="510" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#818cf8">assisted</text>

  <!-- 6 -->
  <rect x="34" y="538" width="1012" height="54" rx="9" fill="#12151c" stroke="#222836"/>
  <text x="54" y="562" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#4a5468">06</text>
  <text x="86" y="562" fill="#e6eaf0" font-size="12.5">Any action whose blast radius is worse than reversible, <tspan font-style="italic">or</tspan> <tspan font-family="ui-monospace, Menlo, monospace" fill="#4ade80">autonomy === 'bounded'</tspan></text>
  <text x="86" y="580" fill="#6b7689" font-size="11">Riverbend's refund bot lands here: high score, but issuing money is not reversible by the thing that issued it.</text>
  <rect x="824" y="550" width="200" height="30" rx="8" fill="#0e1510" stroke="#14532d"/>
  <text x="924" y="570" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#4ade80">automate-bounded</text>

  <!-- 7 -->
  <rect x="34" y="598" width="1012" height="54" rx="9" fill="#12151c" stroke="#0f766e"/>
  <text x="54" y="622" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#4a5468">07</text>
  <text x="86" y="622" fill="#e6eaf0" font-size="12.5">Score <tspan font-family="ui-monospace, Menlo, monospace" fill="#5eead4">&#8805; 82</tspan> <tspan font-style="italic">and</tspan> <tspan font-family="ui-monospace, Menlo, monospace" fill="#5eead4">errorTolerance === 'high'</tspan></text>
  <text x="86" y="640" fill="#6b7689" font-size="11">The only route to full automation. Both conditions, or it falls through to the line below.</text>
  <rect x="824" y="610" width="200" height="30" rx="8" fill="#0d1715" stroke="#0f766e"/>
  <text x="924" y="630" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#5eead4">automate</text>

  <!-- 8 -->
  <rect x="34" y="658" width="1012" height="46" rx="9" fill="#0d0f14" stroke="#222836" stroke-dasharray="4 4"/>
  <text x="54" y="686" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#4a5468">08</text>
  <text x="86" y="686" fill="#96a0b2" font-size="12.5">Everything else. The fall-through is deliberately the cautious rung, not the confident one.</text>
  <rect x="824" y="666" width="200" height="30" rx="8" fill="#0e1510" stroke="#14532d"/>
  <text x="924" y="686" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#4ade80">automate-bounded</text>

  <!-- footer -->
  <rect x="34" y="724" width="1012" height="122" rx="10" fill="#12151c" stroke="#0f766e"/>
  <text x="56" y="750" fill="#5eead4" font-size="13" font-weight="600">Two of the eight gates return "no", and they are checked first.</text>
  <text x="56" y="774" fill="#c3cad6" font-size="12">Roughly a quarter of what people bring to a tool like this should not go near a language model. An assessment tool that always</text>
  <text x="56" y="792" fill="#c3cad6" font-size="12">finds a way to recommend AI is a lead-generation form wearing a lab coat, and every other number it prints inherits that.</text>
  <text x="56" y="816" fill="#6b7689" font-size="11.5">The consumer surface reaches the same verdicts from six questions by defaulting the unasked fields <tspan font-style="italic">downward</tspan>.</text>
  <text x="56" y="834" fill="#6b7689" font-size="11.5">It can be wrong by being too cautious. It cannot be wrong by being too encouraging.</text>
</svg>
